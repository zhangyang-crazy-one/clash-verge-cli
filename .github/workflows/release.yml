name: TUI Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Build and publish Linux TUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "clash-verge-cli") | .version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked -p clash-verge-cli

      - name: Package binary and checksum
        shell: bash
        run: |
          archive="clash-verge-cli-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          install -Dm755 target/release/clash-verge-cli dist/clash-verge-cli
          tar -czf "dist/${archive}" -C dist clash-verge-cli
          cd dist
          sha256sum "${archive}" > "${archive}.sha256"
          rm clash-verge-cli

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "clash-verge-cli ${GITHUB_REF_NAME}"
