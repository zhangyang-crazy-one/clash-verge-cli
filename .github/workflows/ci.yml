name: TUI CI

on:
  push:
    branches:
      - cli-dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, lint, test, and build TUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Verify dependency lockfile
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked -p clash-verge-cli
