name: TUI CI

on:
  push:
    branches:
      - cli-dev
      - main
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before building.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tui-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, lint, test, and build TUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Verify dependency lockfile
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Verify explicit root skip for unreadable-exe fixtures
        run: |
          cargo test --locked -p clash-verge-cli --no-run --message-format=json > "$RUNNER_TEMP/issue83-test-artifacts.jsonl"
          python3 - <<'PY'
          import json, os, subprocess
          with open(os.path.join(os.environ["RUNNER_TEMP"], "issue83-test-artifacts.jsonl")) as stream:
              binaries = [row["executable"] for line in stream if (row := json.loads(line)).get("reason") == "compiler-artifact" and row.get("profile", {}).get("test") and row.get("executable") and row["target"]["name"] == "clash-verge-cli"]
          assert len(binaries) == 1, binaries
          for test in (
              "nondumpable_direct_spawn_binds_and_failure_cleanup_stops_only_that_child",
              "forged_receipt_and_foreign_sender_cannot_authorize_nondumpable_process",
              "reparented_launch_core_is_cleaned_without_touching_another_instances_record",
          ):
              result = subprocess.run(["sudo", "-n", "--", binaries[0], "--exact", f"mihomo_manager::process::tests::{test}", "--nocapture"], text=True, capture_output=True, timeout=60)
              print(result.stdout, result.stderr, flush=True)
              assert result.returncode == 0 and "SKIP: unreadable /proc/exe fixture" in result.stderr and "1 passed" in result.stdout, test
          PY

      - name: Verify disabled-pidfd fallback (ENOSYS and EPERM)
        run: cargo test --locked -p clash-verge-cli disabled_pidfd_seccomp_regression -- --nocapture

      - name: Build release binary
        run: cargo build --release --locked -p clash-verge-cli

  pidfd-musl:
    name: Disabled-pidfd regression with static musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust and native musl linker
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Test real syscall denial in static test subprocesses
        run: cargo test --locked -p clash-verge-cli --target x86_64-unknown-linux-musl disabled_pidfd_seccomp_regression -- --nocapture

  audit:
    name: Dependency advisories, licenses, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  cross:
    name: Cross-build static aarch64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add aarch64-unknown-linux-musl

      - name: Install zig and cargo-zigbuild
        uses: ./.github/actions/setup-zigbuild

      - name: Build
        run: cargo zigbuild --locked -p clash-verge-cli --target aarch64-unknown-linux-musl
