# cargo-deny policy, checked in CI (`cargo deny check`).

[graph]
all-features = true

[advisories]
ignore = [
  # smartstring is unmaintained (no fix exists). It has no known
  # vulnerability; replacing it with compact_str is tracked in #37.
  { id = "RUSTSEC-2026-0249", reason = "unmaintained, no known vulnerability; replacement tracked in #37" },
]

[licenses]
# Licenses compatible with distributing the GPL-3.0-only binary.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
