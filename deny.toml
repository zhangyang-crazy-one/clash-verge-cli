# cargo-deny policy, checked in CI (`cargo deny check`).

[graph]
all-features = true

[licenses]
# Licenses compatible with distributing the GPL-3.0-only binary.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# paste is a frozen, widely-used proc-macro pulled in by boa_engine (the
# profile script engine). "Unmaintained" is not a vulnerability; there is no
# maintained drop-in that boa uses. Revisit if boa switches to pastey.
# unsafe-libyaml is an unmaintained transitive dependency of serde_yaml_ng;
# RUSTSEC-2024-0449 has no patched version. Keep the current YAML parser for
# GUI-compatible config/merge semantics; replacing it requires a separate
# compatibility review. This exception is only for this maintenance notice,
# not for future vulnerability advisories affecting the parser.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2024-0449"]
